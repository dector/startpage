version: "3"

tasks:
  default:
    cmds:
      - task --list-all
  gen:
    cmds:
      - templ generate
  dev:
    env:
      DEV: 1
    cmds:
      - |
        templ generate --watch \
          --open-browser=false \
          --proxy="http://localhost:1110" --proxyport=1112 \
          --cmd="go run cmd/main.go"
    silent: true
  build:
    cmds:
      - go build -o bin/sp.exe cmd/main.go
    silent: true
  deploy:
    deps:
      - build
    cmds:
      - systemctl stop startpage
      - cp bin/sp.exe /opt/startpage/bin/sp.exe
      - systemctl restart startpage
    silent: true
