version: "3"

tasks:
  default:
    cmds:
      - task --list-all
  gen:
    cmds:
      - templ generate
  dev:
    env:
      DEV: 1
    cmds:
      - |
        templ generate --watch \
          --open-browser=false \
          --proxy="http://localhost:1110" --proxyport=1112 \
          --cmd="go run cmd/main.go"
    silent: true
  build:
    cmds:
      - go build -o bin/startpage cmd/main.go
    silent: true

  deploy:init:
    cmds:
      - sudo cp startpage.service /etc/systemd/user/
      - systemctl --user daemon-reload
      - systemctl --user enable startpage
      - task deploy
  deploy:
    deps:
      - build
    cmds:
      - sudo cp bin/startpage /usr/local/bin/startpage
      - systemctl --user restart startpage
